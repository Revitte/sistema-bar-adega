<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Produtos - Bar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <h1 class="mb-4">🍺 Produtos</h1>

  <table class="table table-striped bg-white">
    <thead>
    <tr>
      <th>Nome</th>
      <th>Categoria</th>
      <th>Preço</th>
      <th>Estoque</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${produtos}">
      <td th:text="${p.nome}"></td>
      <td th:text="${p.categoria}"></td>
      <td th:text="${p.preco}"></td>
      <td th:text="${p.estoque}"></td>
    </tr>
    </tbody>
  </table>

  <h3 class="mt-5">Novo Produto</h3>
  <form th:action="@{/produtos}" th:object="${produto}" method="post" class="row g-3">
    <div class="col-md-3">
      <input type="text" th:field="*{nome}" class="form-control" placeholder="Nome" required>
    </div>
    <div class="col-md-3">
      <input type="text" th:field="*{categoria}" class="form-control" placeholder="Categoria" required>
    </div>
    <div class="col-md-2">
      <input type="number" step="0.01" th:field="*{preco}" class="form-control" placeholder="Preço" required>
    </div>
    <div class="col-md-2">
      <input type="number" th:field="*{estoque}" class="form-control" placeholder="Estoque" required>
    </div>
    <div class="col-md-2 d-flex gap-2">
      <button type="submit" class="btn btn-primary w-100">Adicionar</button>
      <button type="submit" th:formaction="@{/produtos/deletar}" class="btn btn-danger w-100">Deletar</button>
    </div>
  </form>
</div>
</body>
</html>
